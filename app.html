<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ManuFlow. Личный кабинет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap&subset=cyrillic,latin" rel="stylesheet">
<style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio, geometry.
   Put this @layer first; product CSS outside the layer wins ordinary layout rules.
   Native hidden and closed-dialog states take precedence over component display rules. */
@layer od-layout {
  [hidden]:not([hidden="until-found" i]) { display: none !important; }
  dialog:not([open]) { display: none !important; }
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }
  .od-icon { display: inline-block; inline-size: var(--od-icon-size, 1em); block-size: var(--od-icon-size, 1em); flex: none; }
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }
  .od-nowrap  { white-space: nowrap; }
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; }
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }
  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
:root [hidden]:where(:not([hidden="until-found" i])) { display: none; }
/* /OD-LAYOUT-PRIMITIVES v1 */

/* tokens: identical to index.html */
:root{
  --bg:#ffffff; --ink:#111111; --ink-2:#444444; --ink-3:#666666;
  --line:#e3e3e3; --line-2:#d0d0d0; --surface:#f4f4f4; --hover:#fafafa;
  --accent:#1a4be0; --accent-hover:#153db8; --accent-tint:#e7edfc; --accent-tint-2:#d6e0fb; --on-accent:#ffffff;
  --danger:#b3261e;
  --r-s:8px; --r-m:12px;
  --sans:"Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --t-fast:160ms; --t-mid:240ms; --ease-out:cubic-bezier(.16,1,.3,1);
  --bar:64px; --side:248px; --tab:64px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,ul,ol,dl,dd,figure,fieldset,blockquote{margin:0}
fieldset{border:0;padding:0;min-width:0}
ul,ol{padding:0;list-style:none}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1:focus{outline:none}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:16px;top:-60px;background:var(--ink);color:#fff;padding:8px 16px;border-radius:var(--r-s);z-index:40}
.skip:focus{top:12px}
.mono,.code{font-family:var(--mono);font-size:13px;letter-spacing:0}
.code{font-weight:500;white-space:nowrap}
.muted{color:var(--ink-3)}
h1{font-weight:500;font-size:30px;line-height:1.15;letter-spacing:-0.025em}
h2{font-weight:500;font-size:20px;line-height:1.3;letter-spacing:-0.015em}
h3{font-weight:500;font-size:16px;line-height:1.35}
.sub{color:var(--ink-2);font-size:15px;margin-top:6px;max-width:68ch}
.label{display:block;font:500 12px/1.3 var(--mono);color:var(--ink-3)}

/* buttons (index.html) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r-s);border:1px solid transparent;font-size:15px;font-weight:500;line-height:1;white-space:nowrap;text-decoration:none;transition:transform var(--t-fast) var(--ease-out),background-color var(--t-fast),border-color var(--t-fast),color var(--t-fast)}
.btn:hover{text-decoration:none}
.btn:active{transform:scale(.98)}
.btn .od-icon{--od-icon-size:18px}
.btn--primary{background:var(--accent);color:var(--on-accent)}
.btn--primary:hover{background:var(--accent-hover);color:var(--on-accent)}
.btn--ghost{background:var(--bg);color:var(--ink);border-color:var(--line-2)}
.btn--ghost:hover{border-color:var(--ink);color:var(--ink)}
.btn--sm{min-height:36px;padding:0 14px;font-size:14px}
.btn--sm .od-icon{--od-icon-size:16px}
.btn[disabled]{background:var(--surface);color:var(--ink-3);border-color:var(--line);cursor:not-allowed;transform:none}
@media (hover:hover){
  .btn:not([disabled]):hover{transform:translateY(-2px)}
  .btn:not([disabled]):active{transform:translateY(0) scale(.98)}
}
.icon-btn{position:relative;display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:var(--r-s);background:none;color:var(--ink-2);transition:background-color var(--t-fast),color var(--t-fast)}
.icon-btn:hover{background:var(--surface);color:var(--ink)}
.icon-btn .od-icon{--od-icon-size:20px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:500;text-align:left}
.linkbtn:hover{text-decoration:underline;text-underline-offset:3px}
.back{display:inline-flex;align-items:center;gap:6px;min-height:36px;margin-bottom:8px;padding:0;background:none;border:0;color:var(--ink-2);font-size:14px}
.back:hover{color:var(--ink)}
.back .od-icon{--od-icon-size:16px}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:0 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:13px;line-height:1.2;white-space:nowrap;color:var(--ink)}
.chip .od-icon{--od-icon-size:12px}
.chip--on{border-color:var(--accent);color:var(--accent);background:var(--accent-tint)}
.chip--attn{background:var(--bg);border:1.5px solid var(--ink);font-weight:500}
.chip--ok{background:var(--accent);border-color:var(--accent);color:#fff}
.chip--ink{background:var(--ink);border-color:var(--ink);color:#fff}
.chip--plain{background:var(--bg)}

/* status marks */
.st{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;flex:none;border:1px solid var(--line-2);background:var(--bg);color:transparent}
.st .od-icon{--od-icon-size:12px}
.st--ok{background:var(--accent);border-color:var(--accent);color:#fff}
.st--fix{border:1.5px solid var(--ink);color:var(--ink)}

/* top bar */
.bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:24px;height:var(--bar);padding:0 24px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none;flex:none}
.brand:hover{text-decoration:none}
.brand__mark{display:grid;place-items:center;width:32px;height:32px;border-radius:var(--r-s);background:var(--accent);color:#fff;font:600 16px/1 var(--sans)}
.brand__text{display:grid;line-height:1.15}
.brand__name{display:block;font-weight:600;font-size:17px;letter-spacing:-0.02em}
.brand__sub{display:block;font:400 12px/1.2 var(--mono);color:var(--ink-3)}
.roleswitch{display:flex;align-items:center;gap:12px;margin-left:24px}
.segtabs{display:inline-flex;padding:4px;gap:4px;background:var(--surface);border-radius:10px}
.segtabs button{min-height:36px;padding:0 14px;border:0;border-radius:var(--r-s);background:none;font-size:14px;font-weight:500;color:var(--ink-2);transition:background-color var(--t-fast),color var(--t-fast)}
.segtabs button:hover{color:var(--ink)}
.segtabs button[aria-checked="true"]{background:var(--bg);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.role-select{display:none;height:40px;padding:0 10px;border:1px solid var(--line-2);border-radius:var(--r-s);background:var(--bg);font-size:14px}
.bar__right{margin-left:auto;display:flex;align-items:center;gap:8px}
.badge{position:absolute;top:6px;right:6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font:600 11px/18px var(--sans);text-align:center}
.avatar{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;font:500 13px/1 var(--sans);flex:none}
.notif{position:relative}
.notif__panel{position:absolute;right:0;top:52px;width:380px;max-width:calc(100vw - 32px);background:var(--bg);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:0 12px 32px rgba(17,17,17,.08);overflow:hidden;animation:popIn 200ms var(--ease-out)}
@keyframes popIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.notif__head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.notif__list{max-height:420px;overflow:auto}
.note{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;width:100%;padding:14px 16px;border:0;border-bottom:1px solid var(--line);background:var(--bg);text-align:left;font-size:14px;line-height:1.45}
.note:last-child{border-bottom:0}
.note:hover{background:var(--hover)}
.note__t{display:block;color:var(--ink-2)}
.note--new .note__t{color:var(--ink);font-weight:500}
.note__d{display:block;grid-column:1;font:12px/1.3 var(--mono);color:var(--ink-3)}
.note__new{grid-row:1;grid-column:2;align-self:start;font:500 11px/1.4 var(--mono);color:var(--accent)}
.notif__empty{padding:32px 16px;text-align:center;color:var(--ink-3);font-size:14px}

/* shell */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:calc(100dvh - var(--bar))}
.side{position:sticky;top:var(--bar);align-self:start;height:calc(100dvh - var(--bar));display:flex;flex-direction:column;gap:4px;padding:20px 12px;border-right:1px solid var(--line)}
.side__label{padding:0 12px 8px}
.nav-i{display:flex;align-items:center;gap:12px;width:100%;min-height:40px;padding:0 12px;border:0;border-radius:var(--r-s);background:none;color:var(--ink-2);font-size:15px;text-align:left;transition:background-color var(--t-fast),color var(--t-fast)}
.nav-i:hover{background:var(--hover);color:var(--ink)}
.nav-i .od-icon{--od-icon-size:18px}
.nav-i[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:500}
.nav-i[aria-current="page"] .od-icon{color:var(--accent)}
.nav-i__n{margin-left:auto;font:500 12px/1 var(--mono);color:var(--ink-3)}
.side__foot{margin-top:auto;padding:12px;border-top:1px solid var(--line);display:grid;gap:2px;font-size:14px}
.side__foot b{font-weight:500;display:block}
.side__foot span{display:block;color:var(--ink-3);font-size:13px}
.main{min-width:0;padding:32px 40px 72px}
.page{max-width:1180px}
.page.enter{animation:pageIn 220ms var(--ease-out)}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}

/* tab bar (mobile) */
.tabbar{display:none}

/* cards / panels */
.win{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-m);min-width:0}
.win__head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.win__body{padding:20px}
.panel{background:var(--surface);border-radius:var(--r-s);padding:16px}
.notice{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r-s);background:var(--surface);font-size:14px;color:var(--ink-2);line-height:1.5}
.notice .od-icon{--od-icon-size:18px;color:var(--accent);margin-top:1px}
.notice b{color:var(--ink);font-weight:500}
.stack{display:grid;gap:24px}
.stack-s{display:grid;gap:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.fchip{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 12px;border:1px solid var(--line-2);border-radius:var(--r-s);background:var(--bg);font-size:14px;white-space:nowrap;transition:border-color var(--t-fast),background-color var(--t-fast),color var(--t-fast)}
.fchip:hover{border-color:var(--ink)}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.fchip__n{font:500 12px/1 var(--mono);opacity:.75}

/* tables */
.tbl-wrap{border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line);text-align:left;font:500 12px/1.3 var(--mono);color:var(--ink-3);white-space:nowrap}
.tbl td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background-color var(--t-fast)}
@media (hover:hover){.tbl tbody tr:hover{background:var(--hover)}}
.tbl .num{text-align:right;white-space:nowrap}
.tbl tfoot td{padding:14px 16px;border-top:1px solid var(--line);font-weight:500;background:var(--surface)}
.tlink{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;max-width:420px;padding:0;border:0;background:none;color:var(--ink);font-weight:500;text-align:left;line-height:1.4}
.tlink:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}

/* empty */
.empty{display:grid;justify-items:center;gap:12px;padding:56px 24px;border:1px dashed var(--line-2);border-radius:var(--r-m);text-align:center}
.empty .od-icon{--od-icon-size:28px;color:var(--ink-3)}
.empty h2{font-size:18px}
.empty p{color:var(--ink-2);font-size:15px;max-width:46ch}

/* fields */
.field{display:grid;gap:8px;min-width:0}
.field > label,.field .lbl{font-size:14px;font-weight:500}
.req{color:var(--accent)}
.lbl-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.inp,.field input[type=text],.field input[type=email],.field input[type=tel],.field input[type=search],.field select,.field textarea{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--line-2);border-radius:var(--r-s);background:var(--bg);font-size:15px}
.field textarea{padding:10px 12px;line-height:1.55;resize:vertical;min-height:96px}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.help{font-size:13px;color:var(--ink-3);line-height:1.45}
.err{font-size:13px;color:var(--danger);line-height:1.45}
.warn{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink);font-weight:500}
.warn .od-icon{--od-icon-size:16px;margin-top:1px}
.field.bad input,.field.bad textarea,.field.bad select{border-color:var(--danger)}
.counter{font:500 12px/1.3 var(--mono);color:var(--ink-3);white-space:nowrap}
.counter.ok{color:var(--accent)}
.counter.bad{color:var(--ink)}
.errsum{padding:14px 16px;border:1.5px solid var(--danger);border-radius:var(--r-s);font-size:14px}
.errsum h2{font-size:15px;margin-bottom:6px}
.errsum ul{display:grid;gap:4px}
.errsum button{background:none;border:0;padding:0;color:var(--danger);text-decoration:underline;text-underline-offset:3px;text-align:left}

/* wizard */
.wsteps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:28px}
.wstep{display:grid;gap:8px;width:100%;padding:0;border:0;background:none;text-align:left;color:var(--ink-3)}
.wstep__bar{display:block;height:3px;border-radius:2px;background:var(--line)}
.wstep__t{display:block;font-size:14px;font-weight:500}
.wstep__n{display:block;font:12px/1.2 var(--mono)}
.wstep.done{color:var(--ink-2)}
.wstep.done .wstep__bar{background:var(--ink)}
.wstep[aria-current="step"]{color:var(--ink)}
.wstep[aria-current="step"] .wstep__bar{background:var(--accent)}
.wstep[disabled]{cursor:default}
.wfoot{display:flex;justify-content:space-between;gap:12px;margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
.types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tcard{position:relative;display:grid;gap:6px;padding:18px;border:1px solid var(--line-2);border-radius:var(--r-m);cursor:pointer;transition:border-color var(--t-fast),transform var(--t-fast) var(--ease-out)}
.tcard input{position:absolute;opacity:0;pointer-events:none}
.tcard__t{display:block;font-weight:500}
.tcard__d{display:block;font-size:14px;color:var(--ink-2);line-height:1.45}
.tcard:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-tint)}
.tcard:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
@media (hover:hover){.tcard:hover{transform:translateY(-2px);border-color:var(--ink)}}
.ltabs{display:inline-flex;padding:4px;gap:4px;background:var(--surface);border-radius:10px;margin-bottom:20px}
.ltab{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px;border:0;border-radius:var(--r-s);background:none;font-size:14px;font-weight:500;color:var(--ink-2)}
.ltab[aria-selected="true"]{background:var(--bg);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.ltab .st{width:16px;height:16px}
.ltab .st .od-icon{--od-icon-size:10px}
.kw{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:48px;padding:7px 8px;border:1px solid var(--line-2);border-radius:var(--r-s)}
.kw:focus-within{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.kw__chips{display:contents}
.kwchip{display:inline-flex;align-items:center;gap:2px;min-height:30px;padding:0 2px 0 10px;border-radius:6px;background:var(--surface);font-size:14px}
.kwchip button{display:grid;place-items:center;width:26px;height:26px;border:0;border-radius:4px;background:none;color:var(--ink-3)}
.kwchip button:hover{background:var(--line);color:var(--ink)}
.kwchip .od-icon{--od-icon-size:12px}
.kw input{flex:1 1 160px;min-width:140px;height:32px;border:0;padding:0 4px;outline:none;font-size:15px;background:none}
.udk-list{display:grid;gap:4px;max-height:320px;overflow:auto;margin-top:8px;padding:4px;border:1px solid var(--line);border-radius:var(--r-s)}
.udk-opt{display:grid;grid-template-columns:112px minmax(0,1fr);gap:12px;align-items:center;width:100%;min-height:44px;padding:0 12px;border:0;border-radius:6px;background:none;text-align:left;font-size:14px}
.udk-opt:hover,.udk-opt:focus-visible{background:var(--surface)}
.udk-list .code{white-space:nowrap}
.udk-opt[aria-pressed="true"]{background:var(--accent-tint);color:var(--ink)}
.drop{display:grid;justify-items:center;gap:8px;padding:40px 20px;border:1.5px dashed var(--line-2);border-radius:var(--r-m);text-align:center;color:var(--ink-2);cursor:pointer;transition:border-color var(--t-fast),background-color var(--t-fast)}
.drop .od-icon{--od-icon-size:28px;color:var(--accent)}
.drop b{color:var(--ink);font-weight:500}
.drop u{color:var(--accent);text-underline-offset:3px}
.drop.over,.drop:hover{border-color:var(--accent);background:var(--accent-tint)}
#fileIn:focus-visible + .drop{outline:2px solid var(--accent);outline-offset:2px}
.file{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:var(--r-s)}
.file__ico{display:grid;place-items:center;width:40px;height:48px;border:1px solid var(--line-2);border-radius:4px;font:500 10px/1 var(--mono);color:var(--accent)}
.file__name{display:block;font-weight:500;font-size:15px;overflow-wrap:anywhere}
.file__meta{display:block;font:12px/1.4 var(--mono);color:var(--ink-3)}
.sum-list{display:grid;border-top:1px solid var(--line)}
.sum-list div{display:grid;grid-template-columns:140px minmax(0,1fr);gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.sum-list dt{color:var(--ink-3)}
.sk{display:block;height:14px;border-radius:4px;background:var(--surface);animation:skPulse 1.1s ease-in-out infinite alternate}
@keyframes skPulse{from{opacity:1}to{opacity:.45}}
.sk-row{display:grid;grid-template-columns:20px minmax(0,1fr) 80px;gap:16px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.sk-row:last-child{border-bottom:0}
.sk-dot{width:20px;height:20px;border-radius:50%}

/* report */
.rsum{display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px;margin-bottom:20px}
.rsum__n{font-size:22px;font-weight:500;letter-spacing:-0.02em}
.cells{display:flex;gap:4px}
.cells i{display:block;width:16px;height:16px;border-radius:3px;border:1.5px solid var(--ink)}
.cells i.ok{background:var(--accent);border-color:var(--accent)}
.rule{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px 16px;align-items:start;padding:16px 20px;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:0}
.rule .st{margin-top:2px}
.rule__t{font-weight:500;font-size:15px}
.rule__d{font:12px/1.5 var(--mono);color:var(--ink-3);text-align:right}
.rule--fail .rule__d{color:var(--ink);font-weight:500}
.rule__fix{grid-column:2 / -1;display:grid;gap:10px;padding:14px 16px;background:var(--surface);border-radius:var(--r-s);font-size:14px;color:var(--ink-2)}
.rule__fix b{color:var(--ink);font-weight:500}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.cmp > div{display:grid;gap:6px;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px}
.cmp s{text-decoration-color:var(--danger);text-decoration-thickness:1.5px}
mark,.hl{background:var(--accent-tint);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent);padding:0 2px;border-radius:2px}
.oldlist{display:grid;gap:6px;padding-left:18px;list-style:disc}

/* timeline */
.tl{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));margin:8px 0 32px}
.tl li{position:relative;display:grid;justify-items:center;gap:8px;text-align:center;font-size:13px;color:var(--ink-3);line-height:1.3;padding:0 4px}
.tl li::before{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:var(--line)}
.tl li:first-child::before{display:none}
.tl li.done::before,.tl li.cur::before{background:var(--accent)}
.tl__n{position:relative;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1px solid var(--line-2);background:var(--bg);color:transparent}
.tl__n .od-icon{--od-icon-size:12px}
.tl li.done{color:var(--ink-2)}
.tl li.done .tl__n{background:var(--accent);border-color:var(--accent);color:#fff}
.tl li.cur{color:var(--ink);font-weight:500}
.tl li.cur .tl__n{border:2px solid var(--accent);background:var(--accent-tint)}

/* review */
.rhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;font-size:14px;color:var(--ink-2)}
.ratings{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ratings .od-stat{padding:14px;background:var(--surface);border-radius:var(--r-s)}
.ratings .v{font-size:20px;font-weight:500;letter-spacing:-0.02em}
.remark{display:grid;gap:10px;padding:16px;border:1px solid var(--line);border-radius:var(--r-s)}
.remark__head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.remark__n{font-weight:500}
.remark__sum{margin-left:auto;font:500 13px/1 var(--mono)}
.remark blockquote{padding-left:12px;border-left:2px solid var(--line-2);font-size:14px;color:var(--ink-2)}
.diff{display:grid;gap:6px;font-size:14px}
.diff__row{display:grid;grid-template-columns:56px minmax(0,1fr);gap:8px}
.diff__was{color:var(--ink-3)}
.diff__was s{text-decoration-thickness:1px}
.rev{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px;align-items:start}
.ms{position:sticky;top:calc(var(--bar) + 24px);max-height:calc(100dvh - var(--bar) - 48px);overflow:auto;padding:28px 32px;border:1px solid var(--line);border-radius:var(--r-m);font-size:15px;line-height:1.75;color:var(--ink-2)}
.ms h2{font-size:20px;color:var(--ink);margin-bottom:4px}
.ms h3{color:var(--ink);margin:20px 0 6px}
.ms__meta{margin-bottom:8px;color:var(--ink-3)}
.ms__hint{display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:13px;color:var(--ink-3)}
.ms__hint .od-icon{--od-icon-size:14px;color:var(--accent)}
.ms__refs{list-style:decimal;padding-left:20px}
.frag{display:inline;padding:0 2px;border:0;border-radius:2px;background:var(--accent-tint);box-shadow:inset 0 -2px 0 var(--accent);color:var(--ink);font:inherit;line-height:inherit;text-align:left;cursor:pointer;transition:background-color var(--t-fast)}
.frag:hover{background:var(--accent-tint-2)}
.frag[disabled]{cursor:default}
.crit{display:grid;gap:10px;padding:16px 0;border-bottom:1px solid var(--line)}
.crit:first-child{padding-top:0}
.crit__top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.rate{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-s);overflow:hidden}
.rate label{position:relative;cursor:pointer}
.rate input{position:absolute;opacity:0;pointer-events:none}
.rate span{display:grid;place-items:center;width:40px;height:36px;border-right:1px solid var(--line-2);font:500 14px/1 var(--mono);transition:background-color var(--t-fast),color var(--t-fast)}
.rate label:last-child span{border-right:0}
.rate label:hover span{background:var(--surface)}
.rate input:checked + span{background:var(--ink);color:#fff}
.rate input:focus-visible + span{outline:2px solid var(--accent);outline-offset:-2px}
.crit textarea{min-height:64px}
.dec{display:grid;gap:12px;padding:20px;border-top:1px solid var(--line)}

/* toggle pair */
.pair{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-s);overflow:hidden}
.pair button{min-height:36px;padding:0 14px;border:0;border-right:1px solid var(--line-2);background:var(--bg);font-size:14px;font-weight:500;color:var(--ink-2);transition:background-color var(--t-fast),color var(--t-fast)}
.pair button:last-child{border-right:0}
.pair button:hover{background:var(--surface)}
.pair button[aria-pressed="true"].yes{background:var(--accent);color:#fff}
.pair button[aria-pressed="true"].no{background:var(--ink);color:#fff}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:24px}
.stat{display:grid;gap:4px;padding:16px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--bg);text-align:left;transition:border-color var(--t-fast),transform var(--t-fast) var(--ease-out)}
.stat__v{display:block;font-size:28px;font-weight:500;letter-spacing:-0.03em;line-height:1.1}
.stat__t{display:block;font-size:13px;color:var(--ink-2)}
button.stat:hover{border-color:var(--ink)}
@media (hover:hover){button.stat:hover{transform:translateY(-2px)}}
button.stat[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
button.stat[aria-pressed="true"] .stat__v{color:var(--accent)}

/* charts */
.chart{display:block;width:100%;height:auto}
.chart .b-ink{fill:var(--ink)}
.chart .b-acc{fill:var(--accent)}
.chart .axis{stroke:var(--line-2)}
.chart text{font-family:var(--mono);font-size:12px;fill:var(--ink-3)}
.chart .val{fill:var(--ink);font-weight:500}
.hb{display:grid;gap:12px}
.hb__row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) 40px;gap:16px;align-items:center;font-size:14px}
.hb__t{display:grid;gap:2px;min-width:0}
.hb__t .code{font-size:12px;color:var(--ink-3)}
.hb__name{display:block;line-height:1.35}
.hb__bar i{display:block;height:10px;width:calc(var(--w) * 100%);border-radius:2px;background:var(--ink)}
.hb__row:first-child .hb__bar i{background:var(--accent)}
.hb__v{text-align:right;font-weight:500}

/* picks (checkbox rows) */
.pick{display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;padding:12px 8px;margin:0 -8px;border-radius:var(--r-s);cursor:pointer}
.pick:hover{background:var(--surface)}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick__box{display:grid;place-items:center;width:20px;height:20px;margin-top:2px;border:1.5px solid var(--line-2);border-radius:5px;color:transparent;transition:background-color var(--t-fast),border-color var(--t-fast)}
.pick__box .od-icon{--od-icon-size:12px}
.pick input:checked + .pick__box{background:var(--accent);border-color:var(--accent);color:#fff}
.pick input:focus-visible + .pick__box{outline:2px solid var(--accent);outline-offset:2px}
.pick__name{display:block;font-weight:500;font-size:15px}
.pick__meta{display:block;font:12px/1.5 var(--mono);color:var(--ink-3)}
legend{font:500 12px/1.3 var(--mono);color:var(--ink-3);padding:0;margin-bottom:4px}

/* dialog */
.dlg{width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 32px);padding:0;border:1px solid var(--line);border-radius:var(--r-m);background:var(--bg);color:var(--ink);overflow:auto}
.dlg[open]{animation:dlgIn 240ms var(--ease-out)}
.dlg::backdrop{background:rgba(17,17,17,.36)}
@keyframes dlgIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.dlg__head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:20px 24px;border-bottom:1px solid var(--line)}
.dlg__head .icon-btn{margin:-8px -12px -8px 0}
.dlg__body{display:grid;gap:16px;padding:20px 24px}
.dlg__foot{display:flex;justify-content:flex-end;gap:12px;padding:16px 24px 24px}

/* toast */
.toasts{position:fixed;right:24px;bottom:24px;z-index:50;display:grid;gap:8px;justify-items:end}
.toast{display:flex;align-items:center;gap:10px;max-width:420px;padding:12px 16px;border-radius:var(--r-s);background:var(--ink);color:#fff;font-size:14px;line-height:1.4;box-shadow:0 8px 24px rgba(17,17,17,.16);animation:toastIn 240ms var(--ease-out)}
.toast .od-icon{--od-icon-size:16px;color:#fff}
.toast.out{opacity:0;transform:translateY(6px);transition:opacity 160ms ease-in,transform 160ms ease-in}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* responsive */
@media (max-width:1180px){
  :root{--side:216px}
  .main{padding:28px 28px 64px}
  .rev{grid-template-columns:1fr}
  .ms{position:static;max-height:420px}
}
@media (max-width:960px){
  .roleswitch .label{display:none}
  .brand__sub{display:none}
  .ratings,.stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:1fr}
  .tl{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:16px}
  .tl li:nth-child(5)::before{display:none}
}
@media (max-width:767px){
  .bar{gap:12px;padding:0 16px}
  .brand__text{display:none}
  .roleswitch{margin-left:0}
  .segtabs{display:none}
  .role-select{display:block}
  .avatar{display:none}
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:20px 16px calc(var(--tab) + env(safe-area-inset-bottom) + 32px)}
  h1{font-size:24px}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);height:calc(var(--tab) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--bg);border-top:1px solid var(--line)}
  .tab-i{position:relative;display:grid;justify-items:center;align-content:center;gap:4px;border:0;background:none;color:var(--ink-3);font-size:11px;font-weight:500;line-height:1.1}
  .tab-i .od-icon{--od-icon-size:22px}
  .tab-i[aria-current="page"]{color:var(--accent)}
  .tab-i__n{position:absolute;top:6px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--accent);color:#fff;font:600 10px/16px var(--sans)}
  .toasts{left:16px;right:16px;bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 12px);justify-items:stretch}
  .toast{max-width:none}
  .filters{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px 16px;padding:0 16px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .tbl-wrap{border:0;border-radius:0;overflow:visible}
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tfoot,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{padding:14px 16px;margin-bottom:12px;border:1px solid var(--line);border-radius:var(--r-m)}
  .tbl td{display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px;padding:4px 0;border:0;text-align:left}
  .tbl td::before{content:attr(data-label);font:12px/1.6 var(--mono);color:var(--ink-3)}
  .tbl td.nolabel{grid-template-columns:1fr}
  .tbl td.nolabel::before{display:none}
  .tbl .num{text-align:left}
  .tbl tfoot tr{background:var(--surface)}
  .tbl tfoot td{border:0;background:none;padding:4px 0}
  .tlink{max-width:none}
  .types,.cmp{grid-template-columns:1fr}
  .wsteps{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
  .wstep__t{display:none}
  .wstep[aria-current="step"] .wstep__t{display:block}
  .wstep{grid-column:auto}
  .rule{grid-template-columns:20px minmax(0,1fr);padding:14px 16px}
  .rule__d{grid-column:2;text-align:left}
  .ms{padding:20px}
  .hb__row{grid-template-columns:minmax(0,1fr) 40px}
  .hb__t{grid-column:1 / -1}
  .tl{grid-template-columns:1fr;gap:0}
  .tl li{grid-template-columns:24px minmax(0,1fr);justify-items:start;align-items:center;gap:12px;padding:6px 0;text-align:left}
  .tl li::before{display:none}
  .sum-list div{grid-template-columns:110px minmax(0,1fr)}
  .stat__v{font-size:24px}
  .dlg__foot .btn{flex:1}
  .wfoot .btn{flex:1}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms !important;animation-iteration-count:1 !important;transition-duration:1ms !important}
}
</style>

    { t:'Название на языке текста', ok:c.titleOk, d:c.titleOk ? 'совпадает' : 'не совпадает', fix:'<p>Напишите название на том же языке, что и основной текст рукописи.</p>' },

    { t:'Оформление литературы по ГОСТ', ok:!c.gost.length, d:c.gost.length ? `${c.gost.length} ${plural(c.gost.length,'запись','записи','записей')} с ошибками` : 'без ошибок',
      fix:`<p>После фамилии ставится запятая, инициалы пишутся через пробел. Каждый автор отделяется запятой.</p>${c.gost.map(g => `<div class="cmp"><div><span class="label">Сейчас</span><s>${esc(g.wrong)}</s></div><div><span class="label">Нужно</span><span class="hl">${esc(g.right)}</span></div></div>`).join('')}` },
    { t:'Журнальные источники не старше 5 лет', ok:!c.old.length, d:c.old.length ? `${c.old.length} ${plural(c.old.length,'устаревший','устаревших','устаревших')}` : '2021–2026',
      fix:`<p>Замените эти источники на публикации 2021 года и новее:</p><ul class="oldlist">${c.old.map(o => `<li>${esc(o)}</li>`).join('')}</ul>` },
    { t:'УДК указан', ok:!!c.udk, d:c.udk || 'нет', fix:'<p>Укажите УДК в метаданных работы.</p>' },
    { t:'Обязательные разделы', ok:!c.sections.length, d:c.sections.length ? `нет: ${c.sections.join(', ')}` : 'все на месте', fix:`<p>Добавьте: ${esc(c.sections.join(', '))}. Обязательны введение, методы, результаты, заключение и литература.</p>` },
    { t:'Шифр заявки присвоен', ok:true, d:c.code }
  ];
}

function navCount(v){
  if (v === 'works') return S.works.filter(w => w.mine).length;
  if (v === 'inbox') return S.works.filter(w => w.reviewers.includes(ME_R) && w.status === 'review').length;
  if (v === 'recheck') return S.works.filter(w => w.reviewers.includes(ME_R) && w.status === 'recheck').length;
  if (v === 'panel') return S.works.filter(w => w.status === 'review' && !w.reviewers.length).length;
  if (v === 'doi') return S.works.filter(w => ['approved','doi'].includes(w.status)).length;
  if (v === 'einv') return S.inv.filter(i => i.st === 'wait').length;
  return 0;
}

const kwChips = () => S.wiz.meta[S.wiz.lang].kw.map((k, i) => `<li class="kwchip">${esc(k)}<button type="button" data-act="kwdel" data-i="${i}" aria-label="Удалить слово ${esc(k)}">${icon('x')}</button></li>`).join('');
function updateMeta(){
  const z = S.wiz, m = z.meta[z.lang];
  const [ac, at] = absState(wc(m.abs)), [kc, kt] = kwState(m.kw.length);

function addKw(inp){
  const v = inp.value.replace(/,/g, '').trim(); const arr = S.wiz.meta[S.wiz.lang].kw; const e = $('#kwErr');
  if (!v) return;
  if (arr.length >= 10){ e.textContent = 'Не больше 10 ключевых слов. Удалите лишнее, чтобы добавить новое.'; e.hidden = false; return; }
  if (arr.some(x => x.toLowerCase() === v.toLowerCase())){ e.textContent = 'Это слово уже добавлено.'; e.hidden = false; return; }
  e.hidden = true; arr.push(v); inp.value = ''; $('#kwChips').innerHTML = kwChips(); updateMeta();
}

function wValidate(){
  const z = S.wiz;
  if (z.step === 1){ const miss = LANGS.filter(l => !z.meta[l].title.trim()); if (miss.length) return `Заполните название на языках: ${miss.map(l => L[l]).join(', ')}.`; }
  if (z.step === 2 && !z.udk) return 'Выберите УДК из списка.';
  if (z.step === 3 && !z.file) return 'Загрузите файл рукописи .docx.';
  return '';
}
function handleFile(f){
  if (!f) return;
  if (!/\.docx$/i.test(f.name)){ S.wiz.fileErr = `Файл «${f.name}» не в формате .docx. Сохраните рукопись как .docx и загрузите снова.`; S.wiz.file = null; }
  else { S.wiz.fileErr = ''; S.wiz.file = { name:f.name, size:(f.size / 1048576).toFixed(1).replace('.', ',') + ' МБ' }; S.wiz.err = ''; }
  refresh(S.wiz.file ? '[data-act="wnext"]' : '#fileIn');
}
function runCheck(){
  const z = S.wiz; z.running = true; refresh();
  setTimeout(() => {
    const code = z.draftId || nextCode();
    const c = { abs:{}, kw:{}, titleOk:!mismatch(z.textLang, z.meta[z.textLang].title), refs:14, gost:[GOST_ERR[0]], old:[OLD_SRC[0]], udk:z.udk, sections:[], code };
    LANGS.forEach(l => { c.abs[l] = wc(z.meta[l].abs); c.kw[l] = z.meta[l].kw.length; });
    const pass = rules(c).every(r => r.ok);
    const w = { id:code, mine:true, author:'Курманбаев Т. М.', title:z.meta[z.textLang].title || z.meta.ru.title, type:z.type, udk:z.udk, version:1, status:pass ? 'review' : 'fix', updated:TODAY, deadline:null, reviewers:[], check:c, review:null };
    S.works = S.works.filter(x => x.id !== code); S.works.unshift(w);
    if (pass) notify('editor', `${code} прошла автопроверку и ждёт назначения рецензентов`, {v:'panel'});
    S.wiz = newWiz();
    go('report', code);
    toast(`Работе присвоен шифр ${code}`);
  }, reduce ? 300 : 1200);
}

function validateReview(d, needRemarks){
  const e = [];
  CRIT.forEach(c => { if (!d.ratings[c.k]) e.push({ id:`rate-${c.k}-1`, t:`Поставьте оценку: ${c.t}` }); });
  if (needRemarks && !d.remarks.length) e.push({ id:'remAddBtn', t:'Добавьте хотя бы одно замечание' });
  d.remarks.forEach((r, i) => { if (!r.text.trim()) e.push({ id:`rem-${i}`, t:`Напишите текст замечания ${i + 1}` }); });
  return e;
}
function decide(kind){
  const w = byId(S.id.reviewer), d = draftFor(w.id);
  const errs = validateReview(d, kind === 'send');
  if (errs.length){ S.revErrs = errs; refresh('#revErr'); return; }
  S.revErrs = [];
  const n = revNo(w, ME_R);
  w.review = { by:ME_R, date:TODAY, ratings:Object.assign({}, d.ratings), comments:Object.assign({}, d.comments), remarks:d.remarks.map((r, i) => ({ n:i + 1, text:r.text.trim(), quote:r.quote, sum:RATE, resp:'', fixed:null })) };
  let maxId = Math.max.apply(null, S.inv.map(i => i.id));
  w.review.remarks.forEach(r => S.inv.push({ id:++maxId, r:ME_R, code:w.id, n:r.n, date:TODAY, sum:RATE, st:'wait' }));
  w.updated = TODAY;
  if (kind === 'send'){
    w.status = 'remarks';
    if (w.mine) notify('author', `Получены замечания Рецензента №${n} по ${w.id}`, { v:'card', id:w.id });

  } else {
    w.status = 'approved';
    if (w.mine) notify('author', `${w.id} одобрена Рецензентом №${n}`, { v:'card', id:w.id });
    notify('editor', `${w.id} рекомендована к публикации, можно присвоить DOI`, { v:'doi' });

  if (w.review.remarks.length) notify('editor', `Новые строки счёта: ${w.review.remarks.length} по ${w.id}`, { v:'einv' });
  delete S.drafts[w.id];
  go('inbox');
}

  const W = 640, H = 260, px = 24, bw = 64, base = H - 32, top = 36;
  const max = Math.max.apply(null, data.map(d => d[1])), gap = (W - px * 2 - bw * data.length) / (data.length - 1);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}"><line class="axis" x1="${px}" x2="${W - px}" y1="${base}" y2="${base}"/>${data.map((d, i) => { const h = Math.round((base - top) * d[1] / max), x = px + i * (bw + gap), y = base - h; return `<rect class="${i === data.length - 1 ? 'b-acc' : 'b-ink'}" x="${x}" y="${y}" width="${bw}" height="${h}" rx="4"/><text class="val" x="${x + bw / 2}" y="${y - 8}" text-anchor="middle">${d[1]}</text><text x="${x + bw / 2}" y="${H - 10}" text-anchor="middle">${d[0]}</text>`; }).join('')}</svg>`;
}
function hbars(rows, label){
  const max = Math.max.apply(null, rows.map(r => r[1]));
  return `<ul class="hb" aria-label="${esc(label)}">${rows.map(([t, v, code]) => `<li class="hb__row"><span class="hb__t">${code ? `<span class="code">${code}</span>` : ''}<span class="hb__name">${esc(t)}</span></span><span class="hb__bar" aria-hidden="true"><i style="--w:${(v / max).toFixed(3)}"></i></span><span class="hb__v mono">${v}</span></li>`).join('')}</ul>`;
}

  return `<div class="page-head"><div><h1>Аналитика цитирований</h1><p class="sub">Пример данных. После подключения источника цифры будут обновляться автоматически.</p></div></div>

  <div class="stack"><section class="win" aria-labelledby="c1"><div class="win__head"><h2 id="c1">Цитирования по годам</h2><span class="help">2026 год неполный</span></div><div class="win__body">${vbars(years, 'Цитирования по годам: ' + years.map(y => y[0] + ' ' + y[1]).join(', '))}</div></section>
  <div class="grid2"><section class="win" aria-labelledby="c2"><div class="win__head"><h2 id="c2">Самые цитируемые статьи</h2></div><div class="win__body">${hbars(top, 'Самые цитируемые статьи')}</div></section>
  <section class="win" aria-labelledby="c3"><div class="win__head"><h2 id="c3">По разделам УДК</h2></div><div class="win__body">${hbars(udk.map(u => [u[0], u[1]]), 'Цитирования по разделам УДК')}</div></section></div></div>`;

const VIEWS = { works:vWorks, new:vNew, report:vReport, card:vCard, profile:vProfile, inbox:vInbox, review:vReview, recheck:vRecheck, invoices:vInvoices, rprofile:vRProfile, panel:vPanel, doi:vDoi, einv:vEInv, analytics:vAnalytics };

/* ---------- toast ---------- */
function toast(t){
  const el = document.createElement('div'); el.className = 'toast'; el.innerHTML = icon('check') + `<span>${esc(t)}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 180); }, 3800);
}

/* ---------- dialog ---------- */
const dlg = $('#dlg'); let dlgOpener = null;
function closeDlg(){ if (dlg.open) dlg.close(); }
dlg.addEventListener('close', () => { S.assign = null; if (dlgOpener && dlgOpener.isConnected) dlgOpener.focus(); else { const h = main.querySelector('h1'); if (h) h.focus(); } });
dlg.addEventListener('click', e => { if (e.target === dlg) closeDlg(); });

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el){ if (!$('#notifPanel').hidden && !e.target.closest('.notif')) setNotif(false); return; }
  const a = el.dataset.act, d = el.dataset;
  switch (a){
    case 'role': S.role = d.role; setNotif(false); render(true); break;
    case 'nav': if (d.v === 'new' && S.wiz.running) break; go(d.v); break;
    case 'dlFile': toast(`Скачивание ${d.f} — обезличенная копия без имени автора`); break;
    case 'open': go(d.v, d.id); break;
    case 'filter': S.filter = d.f; refresh(`[data-act="filter"][data-f="${d.f}"]`); break;
    case 'rfilter': S.rfilter = d.f; refresh(`[data-act="rfilter"][data-f="${d.f}"]`); break;
    case 'efilter': S.efilter = d.f; refresh(`[data-act="efilter"][data-f="${d.f}"]`); break;
    case 'bell': setNotif($('#notifPanel').hidden); break;
    case 'readAll': S.notes[S.role].forEach(n => n.unread = false); renderChrome(); renderNotes(); $('#bellBtn').focus(); break;
    case 'note': { const n = S.notes[S.role][+d.i]; n.unread = false; if (n.link) go(n.link.v, n.link.id); else renderChrome(); break; }
    /* wizard */
    case 'wnext': { const err = wValidate(); S.wiz.err = err; if (err){ refresh('#wErr'); break; } S.wiz.step++; S.wiz.reached = Math.max(S.wiz.reached, S.wiz.step); refresh(); const h = main.querySelector('.win h2'); if (h){ h.tabIndex = -1; h.focus(); } break; }
    case 'wprev': S.wiz.err = ''; S.wiz.step = Math.max(0, S.wiz.step - 1); refresh(`[data-act="wstep"][data-s="${S.wiz.step}"]`); break;
    case 'wstep': S.wiz.err = ''; S.wiz.step = +d.s; refresh(`[data-act="wstep"][data-s="${d.s}"]`); break;
    case 'ltab': S.wiz.lang = d.l; refresh(`#lt-${d.l}`); break;
    case 'sample': LANGS.forEach(l => { S.wiz.meta[l] = { title:SAMPLE[l].title, abs:sampleText(l), kw:SAMPLE[l].kw.slice() }; }); S.wiz.err = ''; refresh('#m-title'); toast('Метаданные заполнены примером. Аннотация EN короче нормы'); break;
    case 'kwdel': S.wiz.meta[S.wiz.lang].kw.splice(+d.i, 1); $('#kwChips').innerHTML = kwChips(); $('#kwErr').hidden = true; updateMeta(); $('#m-kw').focus(); break;
    case 'udk': S.wiz.udk = d.code; S.wiz.err = ''; refresh(`[data-act="udk"][data-code="${d.code}"]`); break;
    case 'sampleFile': S.wiz.file = { name:'statya_avtoproverka.docx', size:'1,6 МБ' }; S.wiz.fileErr = ''; S.wiz.err = ''; refresh('[data-act="wnext"]'); break;
    case 'runCheck': runCheck(); break;
    case 'continue': { const w = byId(d.id); S.wiz = newWiz(); S.wiz.draftId = w.id; S.wiz.type = w.type; S.wiz.meta.ru.title = w.title; S.wiz.udk = w.udk; go('new'); break; }
    /* report */
    case 'fixUpload': { const w = byId(d.id); el.disabled = true; el.textContent = 'Проверка…';
      setTimeout(() => { w.check = okCheck(w.id, w.udk); w.version++; w.status = 'review'; w.updated = TODAY; notify('editor', `${w.id} прошла автопроверку и ждёт назначения рецензентов`, {v:'panel'}); refresh(); const h = main.querySelector('h1'); if (h) h.focus(); toast('Автопроверка пройдена. Работа передана редакции'); }, reduce ? 200 : 1000); break; }
    /* card */
    case 'newVersion': { const w = byId(d.id); const bad = w.review.remarks.filter(r => r.resp.trim().length < 3).map(r => r.n);
      S.respErr = new Set(bad); if (bad.length){ refresh(`#resp-${bad[0]}`); break; }
      w.version++; w.status = 'recheck'; w.updated = TODAY; w.review.remarks.forEach(r => { r.diff = { was:r.quote || 'Фрагмент не указан', now:r.resp.trim() }; r.fixed = null; });
      if (w.reviewers.includes(ME_R)) notify('reviewer', `Автор загрузил исправления по ${w.id}. Вам отправлено SMS`, { v:'recheck', id:w.id });
      refresh(); const h = main.querySelector('h1'); if (h) h.focus(); toast('Рецензенту отправлено SMS и письмо'); break; }
    case 'saveProfile': { const p = S.profile, er = {};
      if (!p.fio.trim()) er.fio = 'Укажите ФИО.';
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(p.email.trim())) er.email = 'Проверьте адрес: нужен вид name@university.kg.';
      if (!/^\+?[\d\s()-]{9,}$/.test(p.phone.trim())) er.phone = 'Укажите номер в формате +996 555 123 456.';
      S.profErr = er; const k = Object.keys(er)[0]; refresh(k ? `#pf-${k}` : null); if (!k) toast('Профиль сохранён'); break; }
    /* reviewer */
    case 'frag': { const dr = draftFor(S.id.reviewer); dr.remarks.push({ text:'', quote:d.q }); updRemarks(); const t = $(`#rem-${dr.remarks.length - 1}`); if (t){ t.focus(); t.scrollIntoView({ block:'center', behavior:reduce ? 'auto' : 'smooth' }); } break; }
    case 'remAdd': { const dr = draftFor(S.id.reviewer); dr.remarks.push({ text:'', quote:'' }); updRemarks(); $(`#rem-${dr.remarks.length - 1}`).focus(); break; }
    case 'remDel': { const dr = draftFor(S.id.reviewer); dr.remarks.splice(+d.i, 1); updRemarks(); $('#remAddBtn').focus(); break; }
    case 'jump': { const t = document.getElementById(d.id); if (t){ t.focus(); t.scrollIntoView({ block:'center' }); } break; }
    case 'decide': decide(d.d); break;
    case 'fix': { const w = byId(S.id.reviewer); w.review.remarks[+d.i].fixed = d.v === '1'; refresh(`[data-act="fix"][data-i="${d.i}"][data-v="${d.v}"]`); break; }
    case 'approve': { const w = byId(S.id.reviewer); w.status = 'approved'; w.updated = TODAY; const n = revNo(w, ME_R);
      if (w.mine) notify('author', `${w.id} одобрена Рецензентом №${n}`, { v:'card', id:w.id });
      notify('editor', `${w.id} одобрена после повторной проверки, можно присвоить DOI`, { v:'doi' }); toast('Работа одобрена. Редакция получила уведомление'); go('recheck'); break; }
    case 'returnBack': { const w = byId(S.id.reviewer); w.status = 'remarks'; w.updated = TODAY;
      if (w.mine) notify('author', `${w.id}: часть замечаний не исправлена`, { v:'card', id:w.id }); toast('Работа возвращена автору на доработку'); go('recheck'); break; }
    case 'act': { try { const lines = S.inv.filter(i => i.r === ME_R); const txt = 'Акт выполненных работ (пример)\n' + R[ME_R].name + '\n\n' + lines.map(i => `${i.code}, замечание ${i.n}, ${fmt(i.date)}: ${i.sum} сом`).join('\n') + `\n\nИтого: ${lines.reduce((s, i) => s + i.sum, 0)} сом`; const a2 = document.createElement('a'); a2.href = URL.createObjectURL(new Blob([txt], { type:'text/plain;charset=utf-8' })); a2.download = 'akt-recenzent-2026-11.txt'; document.body.appendChild(a2); a2.click(); a2.remove(); } catch (er) {} toast('Акт за ноябрь 2026 сформирован'); break; }
    case 'udkDel': { const me = R[ME_R]; me.udk = me.udk.filter(c => c !== d.c); WHO.reviewer.role = 'рецензент, УДК ' + (me.udk.join(', ') || 'не выбраны'); refresh('#udkAdd'); break; }
    case 'udkAdd': { const v = $('#udkAdd').value; if (v){ R[ME_R].udk.push(v); WHO.reviewer.role = 'рецензент, УДК ' + R[ME_R].udk.join(', '); refresh('#udkAdd'); toast(`Добавлен УДК ${v}`); } break; }
    case 'saveRProfile': { const p = S.rprofile, er = {};
      if (!p.bank.trim()) er.bank = 'Укажите банк.';
      if (!/^\d{6}$/.test(p.bik.trim())) er.bik = 'БИК состоит из 6 цифр.';
      if (!/^\d{16}$/.test(p.account.replace(/\s/g, ''))) er.account = 'Счёт состоит из 16 цифр.';
      if (!/^\d{14}$/.test(p.inn.trim())) er.inn = 'ИНН состоит из 14 цифр.';
      S.rprofErr = er; const k = Object.keys(er)[0]; refresh(k ? `#rp-${k}` : null); if (!k) toast('Реквизиты сохранены'); break; }
    /* editor */
    case 'assign': S.assign = { id:d.id, sel:new Set(byId(d.id).reviewers), err:'' }; dlgOpener = el; renderAssign(); dlg.showModal(); requestAnimationFrame(() => { const f = dlg.querySelector('input'); if (f) f.focus(); }); break;
    case 'dlgClose': closeDlg(); break;
    case 'doAssign': { const as = S.assign, w = byId(as.id);
      if (!as.sel.size){ as.err = 'Выберите хотя бы одного рецензента.'; const er = $('#asgErr'); er.textContent = as.err; er.hidden = false; break; }
      const was = w.reviewers.slice(); w.reviewers = Array.from(as.sel); w.deadline = '2026-12-04'; w.updated = TODAY;
      if (w.reviewers.includes(ME_R) && !was.includes(ME_R)) notify('reviewer', `Новая работа по УДК ${w.udk}: ${w.id}`, { v:'review', id:w.id });
      dlgOpener = null; closeDlg(); refresh(`[data-act="efilter"][data-f="${S.efilter}"]`); toast(`Рецензенты назначены: ${w.id}`); break; }
    case 'doi': { const w = byId(d.id), num = w.id.split('-').pop(); const v = $(`#doi-${num}`).value.trim();
      S.doiErr = S.doiErr || {};
      if (!/^10\.[^\s\/]+\/\S+$/.test(v)){ S.doiErr[w.id] = 'DOI должен начинаться с 10. и содержать косую черту: 10.префикс/суффикс.'; refresh(`#doi-${num}`); break; }
      delete S.doiErr[w.id]; w.doi = v; w.issue = `${$(`#iss-${num}`).value}, ${$(`#vol-${num}`).value}`; w.status = 'doi'; w.updated = TODAY;
      if (w.mine) notify('author', `Работе ${w.id} присвоен DOI ${v}`, { v:'card', id:w.id });
      refresh(`[data-act="print"][data-id="${w.id}"]`); toast(`DOI присвоен: ${v}`); break; }
    case 'print': { const w = byId(d.id); w.status = 'print'; w.updated = TODAY; if (w.mine) notify('author', `${w.id} отправлена в печать`, { v:'card', id:w.id }); refresh(); const h = main.querySelector('h1'); if (h) h.focus(); toast(`${w.id} отправлена в печать`); break; }
    case 'invApprove': { payInv([+d.id]); break; }
    case 'invApproveSel': { payInv(Array.from(S.invSel)); break; }
  }
});
function payInv(ids){
  if (!ids.length) return;
  const codes = new Set();
  ids.forEach(id => { const i = S.inv.find(x => x.id === id); if (i){ i.st = 'paid'; codes.add(i.code); if (i.r === ME_R) notify('reviewer', `Строка счёта оплачена: ${i.code}, замечание ${i.n}`, { v:'invoices' }); } S.invSel.delete(id); });
  refresh('#invSelBtn'); const b = $('#invSelBtn'); if (b && b.disabled){ const h = main.querySelector('h1'); if (h) h.focus(); }
  toast(`Подтверждено строк: ${ids.length}`);
}
function updRemarks(){ const dr = draftFor(S.id.reviewer); $('#remarks').innerHTML = remarksHTML(dr); $('#remTotal').innerHTML = remTotal(dr); }

document.addEventListener('input', e => {
  const t = e.target, k = t.dataset.in; if (!k) return;
  const z = S.wiz;
  switch (k){
    case 'title': z.meta[z.lang].title = t.value; updateMeta(); break;
    case 'abs': z.meta[z.lang].abs = t.value; updateMeta(); break;
    case 'kw': if (t.value.includes(',')) addKw(t); break;
    case 'udkq': z.udkq = t.value; $('#udkList').innerHTML = udkOptions(); break;
    case 'rcom': draftFor(S.id.reviewer).comments[t.dataset.k] = t.value; break;
    case 'rem': draftFor(S.id.reviewer).remarks[+t.dataset.i].text = t.value; break;
    case 'resp': { const w = byId(S.id.author); const r = w.review.remarks.find(x => x.n === +t.dataset.n); r.resp = t.value; break; }
    case 'prof': S.profile[t.dataset.k] = t.value; break;
    case 'rprof': S.rprofile[t.dataset.k] = t.value; break;
  }
});
document.addEventListener('change', e => {
  const t = e.target, k = t.dataset.in;
  if (t.id === 'roleSel'){ S.role = t.value; render(true); return; }
  if (!k) return;
  switch (k){
    case 'wtype': S.wiz.type = t.value; break;
    case 'textLang': S.wiz.textLang = t.value; updateMeta(); break;
    case 'file': handleFile(t.files && t.files[0]); break;
    case 'rate': { const dr = draftFor(S.id.reviewer); dr.ratings[t.dataset.k] = +t.value; if (S.revErrs.length){ S.revErrs = S.revErrs.filter(x => !x.id.startsWith(`rate-${t.dataset.k}-`)); } break; }
    case 'plang': { const p = S.profile; p.langs = t.checked ? p.langs.concat(t.value) : p.langs.filter(l => l !== t.value); break; }
    case 'invsel': { const id = +t.value; if (t.checked) S.invSel.add(id); else S.invSel.delete(id); const b = $('#invSelBtn'); b.disabled = !S.invSel.size; b.textContent = `Подтвердить выбранные (${S.invSel.size})`; break; }
    case 'asg': { const as = S.assign, er = $('#asgErr');
      if (t.checked && as.sel.size >= 2){ t.checked = false; as.err = 'Можно выбрать не больше двух рецензентов.'; er.textContent = as.err; er.hidden = false; break; }
      if (t.checked) as.sel.add(t.value); else as.sel.delete(t.value); as.err = ''; er.hidden = true; break; }
  }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Escape' && !$('#notifPanel').hidden){ setNotif(false); $('#bellBtn').focus(); return; }
  if (t.dataset && t.dataset.in === 'kw'){
    if (e.key === 'Enter'){ e.preventDefault(); addKw(t); }
    else if (e.key === 'Backspace' && !t.value){ const arr = S.wiz.meta[S.wiz.lang].kw; if (arr.length){ arr.pop(); $('#kwChips').innerHTML = kwChips(); updateMeta(); } }
    return;
  }
  if (t.getAttribute && t.getAttribute('role') === 'tab' && t.dataset.act === 'ltab'){
    const i = LANGS.indexOf(t.dataset.l); let j = null;
    if (e.key === 'ArrowRight') j = (i + 1) % 3; if (e.key === 'ArrowLeft') j = (i + 2) % 3;
    if (j !== null){ e.preventDefault(); S.wiz.lang = LANGS[j]; refresh(`#lt-${LANGS[j]}`); }
  }
});
/* drag and drop for the upload zone */
document.addEventListener('dragover', e => { const dz = e.target.closest && e.target.closest('#drop'); if (dz){ e.preventDefault(); dz.classList.add('over'); } });
document.addEventListener('dragleave', e => { const dz = e.target.closest && e.target.closest('#drop'); if (dz) dz.classList.remove('over'); });
document.addEventListener('drop', e => { const dz = e.target.closest && e.target.closest('#drop'); if (dz){ e.preventDefault(); dz.classList.remove('over'); handleFile(e.dataTransfer.files[0]); } });

if (location.hash === '#new') S.view.author = 'new';  // переход с главной после входа
render(false);
})();
